# ==========================================================
# YOLO11n-Seg 舌象分割训练配置
# ==========================================================


# 预训练模型路径
model: /root/project/tongue_seg/models/pretrained/yolo11s-seg.pt


# 训练轮数
epochs: 200


# 输入图片尺寸
# 舌象属于精细分割任务，建议保持1024提高边界精度
imgsz: 1024


# batch大小
# 根据显存调整，RTX5090/A10 24G建议16~32
batch: 16


# 随机种子，保证实验可复现
seed: 42



# ================= 优化器 =================


# 优化器类型
# AdamW对于医学小数据集泛化效果通常优于SGD
optimizer: AdamW


# 初始学习率
lr0: 0.001


# 最终学习率比例
# 最终学习率 = lr0 * lrf
lrf: 0.01


# 权重衰减，防止模型过拟合
weight_decay: 0.0005



# ================= 训练控制 =================


# 早停策略
# 连续30轮验证集无提升则停止训练
patience: 50


# dataloader线程数量
workers: 8


# 自动混合精度训练
# 降低显存占用，提高训练速度
amp: true


# 缓存数据到内存
# 加快训练速度，需要较大内存
cache: true



# ================= 学习率策略 =================


# 余弦退火学习率
# 前期快速学习，后期小步优化
cos_lr: true



# ================= 正则化 =================


# 标签平滑
# 降低模型过度拟合，提高泛化能力
label_smoothing: 0.1


# ================= 数据增强 =================


# HSV色调变化
# 模拟不同拍摄设备造成的颜色偏差
hsv_h: 0.015


# HSV饱和度变化
# 模拟不同光照条件
hsv_s: 0.7


# HSV亮度变化
# 模拟环境亮度变化
hsv_v: 0.4



# 随机旋转角度
# 模拟舌头拍摄角度变化
degrees: 10


# 随机平移比例
# 增强目标位置变化鲁棒性
translate: 0.1


# 随机缩放比例
# 模拟不同距离拍摄
scale: 0.5


# 左右翻转概率
# 舌头左右结构基本对称，可以开启
fliplr: 0.5



# ================= Segmentation增强 =================


# Mosaic增强概率
# 拼接4张图片，提高模型检测小目标能力
mosaic: 0.5


# MixUp增强概率
# 两张图片融合，提高泛化能力
mixup: 0.1


# Copy-Paste增强概率
# 对分割任务有效，提高mask边界学习能力
copy_paste: 0.2